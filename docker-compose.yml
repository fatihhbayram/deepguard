services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deepguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deepguard}
      POSTGRES_DB: ${POSTGRES_DB:-deepguard}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deepguard} -d ${POSTGRES_DB:-deepguard}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-deepguard}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-deepguard123}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9002}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deepguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deepguard}
      POSTGRES_DB: ${POSTGRES_DB:-deepguard}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      # A second database on the same server, used by `pytest` and by nothing else. This
      # container is where the suite runs, so the setting lives here and deliberately not
      # on `api-worker`: the worker has no business knowing this database exists, and the
      # suite queueing jobs the worker can never see is the whole point (P6-F1). The
      # credentials above reach it — same server, different database — so no second set of
      # secrets is introduced to support tests.
      TEST_POSTGRES_DB: ${TEST_POSTGRES_DB:-deepguard_test}
      # Which deployment this is, and the only thing that decides whether the web session
      # cookie is marked `Secure` (R1-T1). Passed through from the host with no default: if
      # the variable is not set where `docker compose` runs, it is not set in the container
      # either, and the application's fail-secure default applies.
      #
      # Deliberately not `${DEEPGUARD_ENV:-development}`. A default here would substitute an
      # explicit `development` for a variable nobody set, which is the one value that turns
      # the `Secure` flag off — so Compose would quietly undo the application's fail-secure
      # behaviour on any host that had not been configured. Plain-HTTP development is the
      # case that has to ask: run with `DEEPGUARD_ENV=development docker compose up`, or set
      # it in a local `.env`.
      DEEPGUARD_ENV:
      # The browser origin the dashboard is served from, and the only one the API accepts a
      # session-authenticated mutation from (R1-T2). Comma-separated if a deployment really
      # is served on more than one.
      #
      # It cannot be derived from the request: the browser posts to the web application,
      # which forwards the call over the Docker network, so what arrives here is `api:8000`
      # and the origin the person is on has to be stated.
      #
      # The default is the local dashboard, which is what `WEB_PORT` publishes by default —
      # unlike `DEEPGUARD_ENV` above, a default here disables nothing: it names one specific
      # origin, and a production deployment that forgets to set its own has every dashboard
      # submission refused rather than quietly accepted from anywhere. Override it in `.env`
      # alongside `WEB_PORT` whenever the dashboard is not on `http://localhost:3000`.
      DEEPGUARD_WEB_ORIGIN: ${DEEPGUARD_WEB_ORIGIN:-http://localhost:3000}
      # Object storage is reached over the Docker network, never the published host port.
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-deepguard}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-deepguard123}
      # Detector credentials. Absent or wrong, the upload still succeeds and the
      # analysis records a failed NVIDIA signal.
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_SVD_FUNCTION_ID: ${NVIDIA_SVD_FUNCTION_ID:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    # What this container may take from the host (R1-T3). The API serves requests and stages
    # uploads; it transcodes nothing and infers nothing, so it is the modest one of the pair
    # — FastAPI, SQLAlchemy and an upload buffered to disk, not a model in memory.
    #
    # `deploy.resources.limits` is honoured by `docker compose up` on Compose v2, so these
    # apply to an ordinary local stack and not only to Swarm. Below them the container is
    # killed by the kernel's OOM killer rather than the host being driven into swap, which is
    # the whole point: a leak should cost one container and not the machine PostgreSQL and
    # MinIO are also on.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  # Same image as the API, different entrypoint: one codebase, and the queue is the only
  # thing the two processes say to each other. It publishes no port and serves no
  # request — nothing talks to it, it only reads the jobs table.
  api-worker:
    build:
      context: ./apps/api
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deepguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deepguard}
      POSTGRES_DB: ${POSTGRES_DB:-deepguard}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-deepguard}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-deepguard123}
      # This is the process that actually calls NVIDIA. Without credentials it still runs
      # every job to completion and records a failed signal for each.
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_SVD_FUNCTION_ID: ${NVIDIA_SVD_FUNCTION_ID:-}
      # The second NIM this process calls, and a separate deployment from the one above:
      # one API key, two functions, two independent signals.
      NVIDIA_ASD_FUNCTION_ID: ${NVIDIA_ASD_FUNCTION_ID:-}
      # Speaker diarization runs locally, in this process, against a gated Hugging Face
      # model, and its turns are what the Active Speaker NIM is given to match faces
      # against. Unset, the active-speaker signal fails and the other two are unaffected.
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
      # How long each external operation may run before it is stopped and the job closed as
      # failed (R1-T3). Every one of them has a default in `app/limits.py` equal to the value
      # that was hardcoded before, so an unset variable changes nothing; they are listed here
      # without defaults so `docker compose config` shows an operator the full set of knobs
      # and a value set on the host reaches the process that uses it.
      #
      # The transcode bound is the one worth revisiting per deployment: it scales with the
      # machine rather than with the service, and a host that gives this container one core
      # will need longer for the same 4K source than the one the 900 s default was measured
      # on. The CPU limit below and this timeout are therefore tuned together, or a tighter
      # `cpus` quietly turns working uploads into failed jobs.
      DEEPGUARD_FFMPEG_TIMEOUT_SECONDS:
      DEEPGUARD_AUDIO_EXTRACTION_TIMEOUT_SECONDS:
      DEEPGUARD_FFPROBE_TIMEOUT_SECONDS:
      DEEPGUARD_NVIDIA_SVD_TIMEOUT_SECONDS:
      DEEPGUARD_NVIDIA_ASD_TIMEOUT_SECONDS:
      DEEPGUARD_DOWNLOAD_SOCKET_TIMEOUT_SECONDS:
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    # The heavy container, and the reason this task exists (R1-T3). It runs ffmpeg over 4K
    # sources and holds a pyannote pipeline — torch, and the diarization model's weights — in
    # memory for the length of a job, so it is the one process here that can plausibly eat a
    # host.
    #
    # 4 GB against the API's 2 GB is sized for that pipeline plus one transcode, with room
    # for the ONNX runtime AASIST runs on. It is a ceiling rather than a reservation: a job
    # that stays inside it sees no difference, and one that does not is OOM-killed as this
    # container, which the lease in `app/worker.py` then recovers as a stale claim — a failed
    # analysis with a reason, instead of a host that started swapping.
    #
    # `cpus` is a quota, not a pinning, and it bounds ffmpeg specifically: libx264 will use
    # every core it is offered, and an unbounded transcode is what starves PostgreSQL on a
    # single-host deployment. Read it together with `DEEPGUARD_FFMPEG_TIMEOUT_SECONDS` above.
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G

  web:
    build:
      context: ./apps/web
      args:
        # Baked into the browser bundle at build time, so it must be host-reachable.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      # Server-side rendering talks to the API over the Docker network.
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
    # The lightest of the three (R1-T3). Next.js server-side rendering forwarding calls to
    # the API: no media ever passes through this process, so 1 GB is generous and exists to
    # bound a leak rather than to fit the workload.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

volumes:
  postgres_data:
  minio_data:
